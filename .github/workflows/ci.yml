name: Terraform CI/CD

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "terraform/**"
      - "policy/**"
      - ".github/workflows/**"

permissions:
  id-token: write
  contents: read

jobs:
  # 1) Always run static guardrail (code-only) on PRs and pushes
  guardrail_static:
    name: Guardrail — Static Checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install --upgrade checkov
      - name: Checkov (Terraform code)
        run: |
          checkov -d terraform \
            --check CKV_AWS_24,CKV_AWS_23,CKV_AWS_382,CKV2_AWS_5 \
            --quiet

  # 2) Always produce plan + your two reports (even if guardrail fails)
  plan_reports:
    name: Plan → Checkov CLI + Conftest (artifacts)
    runs-on: ubuntu-latest
    needs: guardrail_static
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::281517525855:role/gh-oidc-terraform-deployer
          aws-region: us-east-1
          audience: sts.amazonaws.com
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init -input=false -reconfigure

      - name: Terraform Plan (no apply)
        working-directory: ./terraform
        run: terraform plan -input=false -out=tfplan

      - name: Prepare reports dir
        run: mkdir -p reports

      - name: Render plan.json
        working-directory: ./terraform
        run: terraform show -json tfplan > ../reports/plan.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install --upgrade checkov

      - name: Install Conftest
        run: |
          VER=0.52.0
          curl -L -o conftest.tgz https://github.com/open-policy-agent/conftest/releases/download/v${VER}/conftest_${VER}_Linux_x86_64.tar.gz
          tar -xzf conftest.tgz
          sudo mv conftest /usr/local/bin/
          conftest --version

      - name: Checkov (plan.json)
        run: checkov -f reports/plan.json -o cli --external-checks-dir policy/checkov | tee reports/checkov_cli.txt

      - name: Conftest (plan.json)
        run: conftest test reports/plan.json --policy policy/conftest | tee reports/conftest.txt

      - uses: actions/upload-artifact@v4
        with:
          name: compliance-reports
          path: |
            reports/plan.json
            reports/checkov_cli.txt
            reports/conftest.txt

  # 3) Only apply on main pushes IF guardrail passed
  terraform_apply:
    name: Terraform Validate & Deploy
    runs-on: ubuntu-latest
    needs: guardrail_static
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.guardrail_static.result == 'success'
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::281517525855:role/gh-oidc-terraform-deployer
          aws-region: us-east-1
          audience: sts.amazonaws.com
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init -input=false -reconfigure

      - name: Terraform Validate
        working-directory: ./terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: ./terraform
        run: terraform plan -input=false -out=tfplan

      - name: Terraform Apply (main only)
        working-directory: ./terraform
        run: terraform apply -auto-approve tfplan
