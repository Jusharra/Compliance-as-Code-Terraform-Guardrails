name: Terraform CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "terraform/**"
      - "policy/**"
      - ".github/workflows/**"

permissions:
  id-token: write
  contents: read

jobs:
  # Runs on BOTH pull_request and push (main)
  guardrail_static:
    name: Guardrail — Static Checkov
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Checkov
        run: pip install --upgrade checkov

      # Keep demo focused on SG violations
      - name: Checkov (Terraform code)
        run: |
          checkov -d terraform \
            --check CKV_AWS_24,CKV_AWS_23,CKV_AWS_382,CKV2_AWS_5 \
            --quiet

  terraform:
    name: Terraform Validate & Deploy
    runs-on: ubuntu-latest
    # Only run on push — and ONLY if guardrail passed
    if: github.event_name == 'push' && needs.guardrail_static.result == 'success'
    needs: [guardrail_static]

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::281517525855:role/gh-oidc-terraform-deployer
          aws-region: us-east-1
          audience: sts.amazonaws.com

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Terraform Init
        run: terraform init -input=false -reconfigure
        working-directory: ./terraform

      - name: Terraform Validate
        run: terraform validate
        working-directory: ./terraform

      - name: Who am I?
        run: aws sts get-caller-identity

      - name: S3 getters sanity (expect no AccessDenied)
        run: |
          set -e
          aws s3api get-bucket-accelerate-configuration --bucket cac-demo-logs-8d5e3627 || true
          aws s3api get-bucket-website --bucket cac-demo-logs-8d5e3627 || true
          aws s3api get-bucket-encryption --bucket cac-demo-logs-8d5e3627 || true

      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan
        working-directory: ./terraform

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve tfplan
        working-directory: ./terraform
