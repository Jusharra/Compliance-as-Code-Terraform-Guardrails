name: CI (plan only)

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  id-token: write     # REQUIRED for OIDC
  contents: read

jobs:
  compliance:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform   # all TF commands run inside /terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── OIDC: assume your existing role (NO static keys)
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}   # set this one secret only
          aws-region: us-east-1
          output-credentials: true

      - name: Who am I?
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Init (S3 backend)
        env:
          TF_IN_AUTOMATION: "1"
        run: |
          mkdir -p ../reports
          terraform init -input=false -reconfigure

      - name: Validate & Plan
        run: |
          terraform validate
          terraform plan -input=false -out plan.out
          terraform show -json plan.out > ../reports/plan.json
