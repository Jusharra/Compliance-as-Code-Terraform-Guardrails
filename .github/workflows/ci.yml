name: CI (plan only)

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  id-token: write     # REQUIRED for OIDC
  contents: read

jobs:
  compliance:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform   # all TF commands run inside /terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform Init/Plan (export plan.json to reports/)
        run: |
          mkdir -p ../reports
          # Use local backend in CI to avoid requiring access to the remote S3 state
          rm -rf .terraform
          terraform init -input=false -backend=false -reconfigure
          terraform validate
          # Do not refresh from cloud to avoid read permissions during planning
          terraform plan -input=false -refresh=false -lock=false -out plan.out
          terraform show -json plan.out > ../reports/plan.json
